name: Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Rsync code to VPS
        run: |
          rsync --archive --compress --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.deploy-deps-stamp' \
            --exclude '.env' \
            --exclude '*.sqlite' \
            --exclude '*.sqlite-*' \
            --exclude '*.db' \
            -e "ssh -o StrictHostKeyChecking=accept-new -p ${SSH_PORT:-22}" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Install deps and restart service
        run: |
          ssh -o StrictHostKeyChecking=accept-new -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" bash -s -- "$DEPLOY_PATH" "$SERVICE_NAME" <<'REMOTE'
            set -euo pipefail
            deploy_path="$1"; svc="$2"
            source ~/.nvm/nvm.sh
            cd "$deploy_path"
            nvm install
            mkdir -p ~/bin
            ln -sfn "$(readlink -f "$(nvm which current)")" ~/bin/tt-node
            # Rebuild deps only when the lockfile or node version changed (native
            # better-sqlite3 compile is slow); node_modules persists across deploys.
            stamp=".deploy-deps-stamp"
            want="$(node --version)-$(sha256sum package-lock.json | cut -d' ' -f1)"
            if [ ! -d node_modules ] || [ "$(cat "$stamp" 2>/dev/null)" != "$want" ]; then
              npm ci --omit=dev
              echo "$want" > "$stamp"
            else
              echo "deps unchanged; skipping npm ci"
            fi
            sudo systemctl restart "$svc"
          REMOTE
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}

      - name: Health check
        run: |
          ssh -o StrictHostKeyChecking=accept-new -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" bash -s -- "$HEALTH_URL" "$SERVICE_NAME" <<'REMOTE'
            set -euo pipefail
            url="$1"; svc="$2"
            for attempt in $(seq 1 10); do
              code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 "$url" || echo 000)
              if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
                echo "healthy: $url returned $code"
                exit 0
              fi
              echo "attempt $attempt: $url returned $code, retrying..."
              sleep 3
            done
            echo "health check failed; recent service status:"
            systemctl status "$svc" --no-pager --lines 20 || true
            exit 1
          REMOTE
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
